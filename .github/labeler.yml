# Path-based PR labels for actions/labeler@v4 (see .github/workflows/label.yml).
# Only existing repository labels are used.
documentation:
  - '**/*.md'

game-design:
  - docs/learn/**
  - docs/reference/**
  - docs/decisions/**

playtesting:
  - docs/gm/**
  - docs/templates/**
  - docs/history/**

infrastructure:
  - .github/**
  - scripts/**
