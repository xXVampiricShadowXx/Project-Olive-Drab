name: Playtest finding
description: Record an observation or problem from a supervised playtest
title: "[Playtest finding]: "
labels:
  - playtesting
  - human-playtest
body:
  - type: markdown
    attributes:
      value: |
        Record observations separately from interpretations or proposed rule changes.
  - type: input
    id: report
    attributes:
      label: Playtest report
      description: Link the report or identify the session date and rules version.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Scenario, roles, participants, and relevant conditions.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation
      description: What happened, in sequence, without speculation?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on play
      description: What became confusing, slow, ineffective, or unexpectedly useful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Possible next step
      description: Optional hypothesis, follow-up test, or proposed change.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed private or identifying player information.
          required: true
